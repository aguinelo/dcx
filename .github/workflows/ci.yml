name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: node --test tools/eval/scorer.test.mjs tools/eval/compare.test.mjs tools/observe/run.test.mjs tools/observe/collect.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -q -p dcx-cli -- schemas --check
      - run: cargo run -q -p dcx-cli -- run --demo
      - run: cargo run -q -p dcx-cli -- run --job-02
