[workspace]
resolver = "3"
members = [
    "crates/dcx-artifacts",
    "crates/dcx-engine",
    "crates/dcx-sensors",
    "crates/dcx-cli",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
